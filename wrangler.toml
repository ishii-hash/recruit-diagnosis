name = "recruit-site-diagnosis"
compatibility_date = "2026-04-01"
pages_build_output_dir = "."

# D1 データベースのバインディング
# ※ Cloudflareダッシュボードで D1 を作成後、
#    発行された database_id に書き換えてください。
[[d1_databases]]
binding = "DB"
database_name = "recruit-diagnosis"
database_id = "22dc6d60-4ddc-4506-839c-c9823adedbda"

# ガチャ管理画面のパスワード
# 本番環境では Cloudflare Secret に移行してください:
#   wrangler secret put ADMIN_PASSWORD
[vars]
ADMIN_PASSWORD = "change-me-before-deploy"
